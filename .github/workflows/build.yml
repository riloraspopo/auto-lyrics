name: Build Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build release APK
        run: gradle assembleRelease

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          APK_PATH=$(ls app/build/outputs/apk/release/app-release*.apk | head -1)
          cp "$APK_PATH" \
             app/build/outputs/apk/release/auto-lyrics-${{ steps.version.outputs.name }}-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-lyrics-${{ steps.version.outputs.name }}-release
          path: app/build/outputs/apk/release/auto-lyrics-${{ steps.version.outputs.name }}-release.apk
