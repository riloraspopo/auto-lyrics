name: Build Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build release APK
        run: gradle assembleRelease

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APKs
        run: |
          for file in app/build/outputs/apk/release/app-*.apk; do
            filename=$(basename -- "$file")
            newname=$(echo "$filename" | sed "s/app-/auto-lyrics-${{ steps.version.outputs.name }}-/")
            mv "$file" "app/build/outputs/apk/release/$newname"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-lyrics-${{ steps.version.outputs.name }}-apks
          path: app/build/outputs/apk/release/auto-lyrics-*.apk

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version.outputs.name }}
          name: Auto Lyrics v${{ steps.version.outputs.name }}
          artifacts: "app/build/outputs/apk/release/auto-lyrics-*.apk"
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true

      - name: Send APKs to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        run: |
          if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_TO" ]; then
            for file in app/build/outputs/apk/release/auto-lyrics-*.apk; do
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendDocument" \
                -F chat_id="${TELEGRAM_TO}" \
                -F document=@"$file"
            done
          else
            echo "Telegram credentials not set. Skipping..."
          fi
